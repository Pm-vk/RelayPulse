services:
  # 1. Express API Gateway & WebSockets
  - type: web
    name: relaypulse-api
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: relaypulse-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: relaypulse-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: relaypulse-redis
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://relaypulse-client.onrender.com

  # 2. BullMQ Background Worker
  - type: worker
    name: relaypulse-worker
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: relaypulse-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: relaypulse-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: relaypulse-redis
          property: port
      - key: GEMINI_API_KEY
        sync: false

  # 3. Next.js Frontend Dashboard
  - type: web
    name: relaypulse-client
    env: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://relaypulse-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://relaypulse-api.onrender.com

databases:
  - name: relaypulse-db
    databaseName: relaypulse
    user: relaypulse_admin
